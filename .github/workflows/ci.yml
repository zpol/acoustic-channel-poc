name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-PyYAML || true
      - name: Unit + simulation tests (exclude hardware)
        run: |
          PYTHONPATH=. pytest -q -m "not hardware" --tb=short
      - name: Documentation safety scan
        run: |
          PYTHONPATH=. python scripts/docs_safety_scan.py
      - name: Provenance / replay schema tests
        run: |
          PYTHONPATH=. pytest -q tests/test_publication_pass.py -k "provenance or replay or curated_replay or missing_metadata or hash" --tb=short
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          ruff check src tests scripts || true
      - name: Type check (advisory)
        continue-on-error: true
        run: |
          mypy src --ignore-missing-imports || true
